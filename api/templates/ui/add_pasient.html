<style>
    input{
        padding: 4px 10px;
        border: 1px solid aqua;
        border-radius: 4px;
    }
    p{
        font-family: 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', monospace;
    }
    button{
        padding: 4px 13px;
        font-size: 15px;
        border: 1px springgreen solid;
        border-radius: 5px;
        cursor: pointer;
    }
</style>
<h1>Add New Pasient</h1>
{% if messages %}
    <ul>
    {% for mes in messages %}
        <li>{{ mes }}</li>
    {% endfor %}
    </ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button>
</form>
